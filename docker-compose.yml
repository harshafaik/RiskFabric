services:
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:latest
    container_name: riskfabric_clickhouse
    environment:
      - CLICKHOUSE_DB=riskfabric
      - CLICKHOUSE_USER=riskfabric_user
      - CLICKHOUSE_PASSWORD=123
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/01_fraud_scores.sql
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    container_name: riskfabric_redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: riskfabric_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  scorer:
    image: localhost/riskfabric_dlt
    container_name: riskfabric_scorer
    volumes:
      - .:/usr/app:z
    working_dir: /usr/app
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - REDIS_HOST=redis
      - CLICKHOUSE_HOST=clickhouse
      - PYTHONUNBUFFERED=1
      - OLTP_POSTGRES_HOST=oltp-postgres
      - OLTP_POSTGRES_PORT=5432
      - OLTP_POSTGRES_DB=riskfabric_oltp
      - OLTP_POSTGRES_USER=riskfabric_oltp_user
      - OLTP_POSTGRES_PASSWORD=123
    command: python src/ml/scorer.py
    depends_on:
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      oltp-postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    container_name: riskfabric_grafana
    environment:
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:z
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:z
    depends_on:
      clickhouse:
        condition: service_healthy

  oltp-postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: riskfabric_oltp_postgres
    environment:
      - POSTGRES_DB=riskfabric_oltp
      - POSTGRES_USER=riskfabric_oltp_user
      - POSTGRES_PASSWORD=123
    ports:
      - "5433:5432"
    volumes:
      - oltp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskfabric_oltp_user -d riskfabric_oltp"]
      interval: 5s
      timeout: 5s
      retries: 5

  case-admin:
    build:
      context: ./case_admin
      dockerfile: Dockerfile
    container_name: riskfabric_case_admin
    environment:
      - DB_HOST=oltp-postgres
      - DB_PORT=5432
      - DB_NAME=riskfabric_oltp
      - DB_USER=riskfabric_oltp_user
      - DB_PASSWORD=123
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_PASSWORD=admin
      - DJANGO_SUPERUSER_EMAIL=admin@example.com
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8000"
    volumes:
      - ./case_admin:/usr/app
    depends_on:
      oltp-postgres:
        condition: service_healthy

networks:
  default:
    name: riskfabric_default

volumes:
  clickhouse_data:
  clickhouse_logs:
  oltp_postgres_data:
  grafana_data:

